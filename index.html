<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Karla:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    </head>
    <body>
        <div id="main-container">
            <h1 id="title">Generate a<br><span id="title-span">random password</span></h1>
            <h2 id="subtitle">Never use an insecure password again.</h2>
            <div id="options-div">
                <div id="password-length-div" class="option-title">
                    <label for="password-length-input">Password Length</label>
                    <input type="number" id="password-length-input" value="15" min="4" max="20">
                </div>
                <div id="symbols-div" class="option-title">
                    <label for="symbols-input" class="options-checkbox">Include Symbols</label>
                    <input type="checkbox" id="symbols-input" checked>
                </div>
                <div id="numbers-div" class="option-title">
                    <label for="numbers-input" class="options-checkbox">Include Numbers</label>
                    <input type="checkbox" id="numbers-input" checked>
                </div>
            </div>
            <button id="generate-btn" onclick="generatePasswords()">Generate passwords</button>
            <div id="divider-div"></div>
            <div id="passwords-div">
                <div class="password-box" id="password-box1" onclick="copyPassword1()"></div>
                <div class="password-box" id="password-box2" onclick="copyPassword2()"></div>
            </div>
            <script src="index.js"></script>
        </div>
    </body>
</html>
